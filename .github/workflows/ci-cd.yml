# TaskFlow CI/CD
#
#   test ─┐
#   security ─┼─> build (image + scan, push on branch pushes) ─> deploy (approval → GitOps commit)
#   config ─┘
#
# Security notes
# - Every third-party action is pinned to a full commit SHA, not a tag. Tags can be
#   moved: in March 2026 attackers repointed 75 of 76 aquasecurity/trivy-action tags
#   to credential-stealing code. A SHA cannot be repointed.
# - Workflow-level permissions are empty; each job asks only for what it needs.
# - Downloaded tools are verified against a pinned SHA-256 checksum.
name: ci-cd

on:
  push:
    branches: [main, "devops/**"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.12"
  HELM_VERSION: v3.21.4
  KUBECONFORM_VERSION: v0.7.0
  KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
  PROMETHEUS_VERSION: 3.5.0
  PROMETHEUS_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRIVY_VERSION: v0.74.0

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-throwaway   # disposable CI container, not a real secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d taskflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_NAME: taskflow_test
      DB_USER: ci
      DB_PASSWORD: ci-throwaway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and API tests against real PostgreSQL
        run: pytest --cov=app --cov-report=term --cov-fail-under=80

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # gitleaks scans the whole history, not just HEAD
          persist-credentials: false
      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --no-banner --verbose
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependency vulnerabilities (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
      - name: Misconfiguration scan of Dockerfile and Helm chart (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          helm-values: deploy/helm/taskflow/values-local.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"

  config:
    name: Validate deployment config
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform and promtool (checksum-verified)
        run: |
          curl -sSfL -o kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kc.tgz" | sha256sum -c -
          tar xzf kc.tgz kubeconform
          curl -sSfL -o prom.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prom.tgz" | sha256sum -c -
          tar xzf prom.tgz --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
      - name: Helm lint
        run: helm lint deploy/helm/taskflow -f deploy/helm/taskflow/values-local.yaml --strict
      - name: Render and validate against Kubernetes schemas
        run: |
          helm template taskflow deploy/helm/taskflow -n taskflow \
            -f deploy/helm/taskflow/values-local.yaml > rendered.yaml
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml deploy/platform/jaeger.yaml
      - name: Unit-test SLO alert rules (promtool)
        run: |
          helm template taskflow deploy/helm/taskflow -n taskflow \
            -f deploy/helm/taskflow/values-local.yaml --show-only templates/prometheusrule.yaml \
            | python3 scripts/extract-rules.py > deploy/tests/rules.yaml
          ./promtool check rules deploy/tests/rules.yaml
          cd deploy/tests && ../../promtool test rules slo_rules_test.yaml

  build:
    name: Build, scan and publish image
    needs: [test, security, config]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write          # push to GHCR with the short-lived GITHUB_TOKEN
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name and build metadata
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # registry paths must be lowercase
          {
            echo "image=${REGISTRY}/${owner}/taskflow:${GITHUB_SHA}"
            echo "short=${GITHUB_SHA::7}"
            echo "version=1.0.${GITHUB_RUN_NUMBER}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      # QEMU lets this amd64 runner also build the arm64 variant: kind on an
      # Apple Silicon laptop runs arm64 nodes and cannot run an amd64-only image.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (loaded locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan of the built image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ steps.meta.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true      # fail only on vulnerabilities that have a fix available
          exit-code: "1"
      - name: Smoke-test the container starts
        run: |
          docker run -d --name smoke -p 8000:8000 "${{ steps.meta.outputs.image }}"
          for _ in $(seq 1 20); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf localhost:8000/version | tee version.json
          grep -q "${GITHUB_SHA}" version.json
          docker rm -f smoke
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same Dockerfile, build args and cache as the scanned amd64 image above, so the
      # amd64 layers are reused; arm64 is added for clusters on Apple Silicon.
      - name: Push multi-arch image (immutable tag = full git SHA)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.time }}
          cache-from: type=gha
      - name: Summary
        run: |
          {
            echo "### Build"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${{ steps.meta.outputs.image }}\`"
            echo "- App version: \`${{ steps.meta.outputs.version }}\`"
            echo "- Pushed: ${{ github.event_name != 'pull_request' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Release to local cluster (GitOps)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # The "local" environment has a required-reviewer rule: this job waits for a
    # human to click Approve. That is the manual release gate.
    environment:
      name: local
      url: http://taskflow.localtest.me:8080
    permissions:
      contents: write          # commit the new image tag; nothing else
    concurrency:
      group: deploy-local
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Point the local environment at the new image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          tag="${GITHUB_SHA}"
          sed -i -E "s|^(  tag: ).*|\1\"${tag}\"|" deploy/helm/taskflow/values-local.yaml
          git diff --exit-code deploy/helm/taskflow/values-local.yaml && { echo "Already deployed"; exit 0; }
          git config user.name "taskflow-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(local): taskflow ${tag::7} [skip ci]" \
            -m "Image: ${IMAGE}" \
            -m "Source commit: ${GITHUB_SHA}" \
            -m "Pipeline run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          {
            echo "### Release"
            echo "Committed image tag \`${tag::7}\` to \`values-local.yaml\` on \`${GITHUB_REF_NAME}\`."
            echo "Argo CD will sync it within ~1 minute. Verify with \`make verify\`."
          } >> "$GITHUB_STEP_SUMMARY"
