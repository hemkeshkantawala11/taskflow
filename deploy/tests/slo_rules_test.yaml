# Unit tests for the SLO alerts. CI renders the chart, extracts the rules to
# rules.yaml next to this file (see scripts/extract-rules.py), then runs:
#   promtool test rules slo_rules_test.yaml
rule_files: [rules.yaml]
evaluation_interval: 30s
tests:
  - interval: 30s
    input_series:
      - series: 'http_requests_total{namespace="taskflow", route="/api/tasks", status="200"}'
        values: '0+70x40'
      - series: 'http_requests_total{namespace="taskflow", route="/api/tasks", status="500"}'
        values: '0+30x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: TaskflowHighErrorRate
        exp_alerts:
          - exp_labels: { severity: critical, service: taskflow }
            exp_annotations:
              summary: More than 5% of TaskFlow API requests are failing
              description: 'Current 5m error ratio: 30%.'
              runbook_url: https://github.com/hemkeshkantawala11/taskflow/blob/devops/platform/docs/runbook.md#taskflowhigherrorrate
  - interval: 30s
    input_series:
      - series: 'http_requests_total{namespace="taskflow", route="/api/tasks", status="200"}'
        values: '0+100x40'
    promql_expr_test:
      - expr: taskflow:api_error_ratio:rate5m
        eval_time: 10m
        exp_samples: [{ labels: 'taskflow:api_error_ratio:rate5m', value: 0 }]
    alert_rule_test:
      - eval_time: 10m
        alertname: TaskflowHighErrorRate
        exp_alerts: []
