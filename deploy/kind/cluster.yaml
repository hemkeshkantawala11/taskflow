# Local cluster: 1 control plane + 2 workers, so topology spread and
# node failure / drain scenarios can actually be demonstrated.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: taskflow
nodes:
  - role: control-plane
    extraPortMappings:
      # Traefik's NodePort 30080 -> http://localhost:8080 on your machine
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"   # not exposed to your LAN
        protocol: TCP
  - role: worker
  - role: worker
