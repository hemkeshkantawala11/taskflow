apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskflow.fullname" . }}
  labels: {{- include "taskflow.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "taskflow.dbname" . | quote }}
  DB_PORT: "5432"
  DB_NAME: {{ .Values.database.name | quote }}
  DB_POOL_MAX: {{ .Values.app.dbPoolMax | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  CHAOS_ERROR_RATE: {{ .Values.app.chaosErrorRate | quote }}
  OTEL_ENABLED: {{ .Values.app.tracing.enabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.app.tracing.otlpEndpoint | quote }}
