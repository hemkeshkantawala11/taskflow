{{- if .Values.networkPolicy.enabled }}
# Zero-trust inside the namespace: deny everything, then allow only the flows
# the architecture needs (see docs/architecture.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  labels: {{- include "taskflow.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Every pod may resolve DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  labels: {{- include "taskflow.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Web pods: traffic in from the ingress controller, Prometheus and kubelet probes;
# traffic out only to Postgres and the trace collector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskflow.fullname" . }}-web
  labels: {{- include "taskflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "taskflow.appSelector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }} }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
        - ipBlock: { cidr: {{ .Values.networkPolicy.nodeCIDR }} }
      ports:
        - { protocol: TCP, port: {{ .Values.service.targetPort }} }
  egress:
    - to:
        - podSelector:
            matchLabels: {{- include "taskflow.dbSelector" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.tracingNamespace }} }
      ports:
        - { protocol: TCP, port: 4318 }
---
# Postgres: only the web pods may connect. No egress beyond DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskflow.dbname" . }}
  labels: {{- include "taskflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "taskflow.dbSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "taskflow.appSelector" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 5432 }
{{- end }}
