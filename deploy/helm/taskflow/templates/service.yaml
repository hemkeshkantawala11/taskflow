apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskflow.fullname" . }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    {{- include "taskflow.appSelector" . | nindent 4 }}
spec:
  type: ClusterIP   # only reachable inside the cluster; the Ingress is the public entry point
  selector: {{- include "taskflow.appSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
