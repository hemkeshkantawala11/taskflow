# The app namespace enforces the "restricted" Pod Security Standard: the API
# server rejects any pod that runs as root, can escalate privileges, etc.
apiVersion: v1
kind: Namespace
metadata:
  name: taskflow
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata: { name: traefik }
---
apiVersion: v1
kind: Namespace
metadata: { name: monitoring }
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata: { name: argocd }
